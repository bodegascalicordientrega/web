    <style>
        /* Estilos para la página */
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            padding: 20px;
            overflow-y: auto;
            max-height: 80vh;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 80%;
            padding: 10px;
            margin-right: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .search-bar button {
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #000;
            color: white;
            cursor: pointer;
        }

        .product {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .clickable {
            color: #007BFF;
            text-decoration: underline;
            cursor: pointer;
        }

        .clickable:hover {
            color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>@armeniaquindio</h1>
            <p>Punto Cordientrega: Cl. 11 #9-20, Comuna 3, Centro Cali, Valle, Colombia</p>
        </header>

        <!-- Formulario de búsqueda -->
        <form id="searchForm">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar inventario..." oninput="searchProducts()">
                <button type="button" onclick="searchProducts()">Buscar</button>
            </div>
        </form>

        <!-- Sección de productos -->
        <section id="productos-container">
            <!-- Los productos se agregarán dinámicamente aquí -->
        </section>

        <!-- Footer -->
        <footer>
            <p>&copy; <span id="year"></span> <strong>Cordientrega</strong></p>
            <p>Bitcoin: <a href="bitcoin:15gdaABbh6oZZG4kfQPXoSdqj9YMsg5RaH" target="_blank">15gdaABbh6oZZG4kfQPXoSdqj9YMsg5RaH</a></p>
        </footer>
    </div>

    <script>
        // Precios fijos en COP para cada producto
        const preciosCOP = {
            producto1: 500000, 
            producto2: 10000000, 
            producto3: 150000, 
            producto4: 500000  
        };

        // Función para agregar productos dinámicamente al HTML
        function agregarProductosAlHTML() {
            const container = document.getElementById('productos-container');
            for (const producto in preciosCOP) {
                const productoDiv = document.createElement('div');
                productoDiv.classList.add('product');
                productoDiv.setAttribute('data-name', producto.toLowerCase()); // Añadir un atributo para facilitar la búsqueda
                productoDiv.innerHTML = `
                    <h2>${producto}</h2>
                    <p id="precio-lightning-${producto}">Cargando precio...</p>
                    <a href="#" id="link-lightning-${producto}" class="clickable">Pagar con Lightning</a>
                `;
                container.appendChild(productoDiv);
            }
        }

        // Función para filtrar productos basados en la búsqueda
        function searchProducts() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const productos = document.querySelectorAll('.product');

            productos.forEach(producto => {
                const productName = producto.getAttribute('data-name');
                if (productName.includes(input)) {
                    producto.style.display = 'block';
                } else {
                    producto.style.display = 'none';
                }
            });
        }

        // Función para actualizar los precios (simulando la lógica del precio en Lightning)
        function actualizarPrecios() {
            for (const [producto, precioCOP] of Object.entries(preciosCOP)) {
                const precioElement = document.getElementById(`precio-lightning-${producto}`);
                if (precioElement) {
                    precioElement.innerText = `Precio en Lightning: ${precioCOP * 0.0000001} satoshis`; // Solo como ejemplo
                }

                const linkElement = document.getElementById(`link-lightning-${producto}`);
                if (linkElement) {
                    linkElement.setAttribute('href', `lightning:lnbc1pnc7zscpp5pad0vy96m86ezk7z95d92tl87k97x0xst07rkex77gmqyalt56jsdqqcqzzgxqyz5vqrzjqwnvuc0u4txn35cafc7w94gxvq5p3cu9dd95f7hlrh0fvs46wpvhdr88fux277w9wsqqqqryqqqqthqqpysp5aavhww3dn4f92r59kfj2vca2x58je2a4e6gpxfcd85ze6wgaap9s9qrsgq8snrrprr0th0n0r6y0fwxdsm47a08w9qh0m4tztw6czwn3swgvm3s8gp2w86p87pl2mkctpuhj7qhpdzh6d7r7hquy2pyh65wquclxgpf6u3am?message=Pago%20por%20${producto}&amount=${precioCOP * 0.0000001}`);
                }
            }
        }

        // Actualizar el año en el footer
        document.getElementById("year").textContent = new Date().getFullYear();

        // Llamar a las funciones al cargar la página
        window.onload = function() {
            agregarProductosAlHTML(); // Agregar productos al HTML
            actualizarPrecios();      // Actualizar los precios en Lightning
        };
    </script>

</body>
</html>
